name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      # Cypress precisa do prefixo CYPRESS_
      CYPRESS_VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      CYPRESS_VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java (Para Emuladores)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Start Firebase Emulators
        run: firebase emulators:start --only auth,firestore,hosting --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} &

      - name: Start Vite
        run: npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &

      - name: Wait for services
        run: npx wait-on -t 90000 http-get://127.0.0.1:5173 tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 || (cat vite.log; exit 1)

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          record: true
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}